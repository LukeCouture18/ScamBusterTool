<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Finder · Investigation</title><style>
:root{--bg:#08110e;--panel:#101d18;--line:#284437;--green:#65f2a5;--text:#e8f4ed;--muted:#93aa9e;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}h1{margin:0;font-size:22px}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 65px)}aside{border-right:1px solid var(--line);padding:18px}.content{padding:22px}input,textarea,button,select{width:100%;background:#0a1511;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:7px;margin:5px 0}button{cursor:pointer;background:#173d2c;color:var(--green);font-weight:700}button:hover{background:#205039}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.case{cursor:pointer;padding:10px;border-bottom:1px solid var(--line)}.case:hover{color:var(--green)}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);margin:2px}.muted{color:var(--muted)}.warn{color:var(--warn)}pre{white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto}.tabs button{width:auto;margin-right:7px}.hidden{display:none}progress{width:100%}a{color:var(--green)}
/* mip-theme:start (generated by scripts/sync-ui-tokens.mjs from sdk/ui/suite.css; edit that file, not this block) */
:root{--mip-bg:#080c16;--mip-bg-glow:radial-gradient(circle at 58% -20%, #12213b 0, transparent 30%);--mip-surface:#0e1624;--mip-surface-2:#101827;--mip-surface-3:#141d2c;--mip-sidebar:rgba(8, 13, 24, .94);--mip-border:#1e2b3e;--mip-border-strong:#2a3a54;--mip-text:#eef3fb;--mip-text-2:#bfcce0;--mip-muted:#8492a9;--mip-faint:#66758d;--mip-blue:#69a7fa;--mip-blue-strong:#5f9cf6;--mip-blue-bg:#16243b;--mip-green:#48d3a0;--mip-green-bg:#10281f;--mip-amber:#f2b45a;--mip-amber-bg:#2a2111;--mip-red:#f36c77;--mip-red-bg:#2c1419;--mip-violet:#a78bfa;--mip-radius:10px;--mip-radius-sm:7px;--mip-shadow:0 8px 22px rgba(0, 0, 0, .28);--mip-font:"Inter", "Segoe UI", Arial, sans-serif;--mip-mono:"Cascadia Code", "SFMono-Regular", Consolas, monospace}:root{--bg:var(--mip-bg);--panel:var(--mip-surface);--line:var(--mip-border);--text:var(--mip-text);--muted:var(--mip-muted);--green:var(--mip-blue);--warn:var(--mip-amber)}@media(max-width:690px){main{grid-template-columns:minmax(0,1fr)}header{flex-wrap:wrap;gap:12px;padding:16px}aside{border-right:0;border-bottom:1px solid var(--mip-border)}.content{padding:16px}.row{grid-template-columns:minmax(0,1fr)}}main>*,header>*{min-width:0;overflow-wrap:anywhere}body{background:var(--mip-bg-glow),var(--mip-bg);font-family:var(--mip-font)}input,textarea,select{background:var(--mip-surface-2)!important}button{background:var(--mip-blue-bg);border-color:var(--mip-border-strong)}button:hover{background:#1d3150}
/* mip-theme:end */
</style></head><body>
<header><h1>◈ Site Finder <span class="muted">· Investigation (engine v0.1)</span></h1><div>Passive-first evidence workspace</div></header><main><aside><input id="search" placeholder="Search evidence…"><button onclick="doSearch()">Search</button><h3>Cases</h3><div id="cases"></div><input id="caseName" placeholder="New case name"><button onclick="newCase()">Create case</button></aside><section class="content"><div id="welcome" class="card"><h2>Deep site investigation</h2><p class="muted">Create a case, add a suspected domain, then collect public evidence. Credentials are never stored.</p></div><div id="caseView" class="hidden"><div class="card"><h2 id="caseTitle"></h2><div class="row"><div><input id="siteUrl" placeholder="https://suspected-domain.example"><button onclick="addSite()">Add website</button></div><div><textarea id="note" placeholder="Analyst note"></textarea><button onclick="addNote()">Add note</button></div></div></div><div id="sites"></div><div class="card"><h3>Timeline and evidence</h3><div id="feed"></div></div></div><div id="searchView" class="hidden"></div></section></main>
<script>
let current=null, jobs={}; const api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json'},...o}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadCases(){let x=await api('/api/cases');cases.innerHTML=x.map(c=>`<div class=case onclick="openCase('${c.id}')"><b>${esc(c.name)}</b><br><small class=muted>${esc(c.status)} · ${esc(c.id)}</small></div>`).join('')}
async function newCase(){let n=caseName.value.trim();if(!n)return;let c=await api('/api/cases',{method:'POST',body:JSON.stringify({name:n})});caseName.value='';await loadCases();openCase(c.id)}
async function openCase(id){current=id;welcome.classList.add('hidden');searchView.classList.add('hidden');caseView.classList.remove('hidden');let d=await api('/api/cases/'+id);caseTitle.textContent=d.case.name;sites.innerHTML=d.websites.map(siteCard).join('')||'<div class=card>No websites yet.</div>';feed.innerHTML=[...d.timeline.map(x=>`<p><span class=pill>${esc(x.source_class)}</span> ${esc(x.summary)} <small class=muted>${esc(x.occurred_at)}</small></p>`),...d.notes.map(x=>`<p><span class=pill>analyst note</span> ${esc(x.body)}</p>`)].join('')||'<p class=muted>No events yet.</p>'}
function siteCard(s){return `<div class=card id="c-${s.id}"><h3>${esc(s.title||s.normalized_domain)}</h3><div class=muted>${esc(s.start_url)} · ${esc(s.status)} · ${esc(s.id)}</div><div class=tabs><button onclick="investigate('${s.id}')">Run public investigation</button><button onclick="toggleAuth('${s.id}')">Authenticated mode</button><button onclick="details('${s.id}')">View evidence</button></div><div id="j-${s.id}"></div><div id="a-${s.id}" class=hidden><input id="lu-${s.id}" value="${esc(s.start_url.replace(/\/$/,'')+'/login')}" placeholder="Login URL"><input id="un-${s.id}" autocomplete="off" placeholder="Username/email"><input id="pw-${s.id}" type=password autocomplete="new-password" placeholder="Password (never saved)"><label><input style="width:auto" id="ma-${s.id}" type=checkbox> Show browser for manual challenges</label><button onclick="auth('${s.id}')">Attempt normal login</button><p class="muted">No brute force, bypass, or financial actions.</p></div><div id="d-${s.id}"></div></div>`}
async function addSite(){try{await api('/api/sites',{method:'POST',body:JSON.stringify({case_id:current,url:siteUrl.value})});siteUrl.value='';openCase(current)}catch(e){alert(e.message)}}
async function investigate(id){let x=await api(`/api/sites/${id}/investigate`,{method:'POST'});poll(id,x.job_id)}
function toggleAuth(id){document.getElementById('a-'+id).classList.toggle('hidden')}
async function auth(id){let body={login_url:document.getElementById('lu-'+id).value,username:document.getElementById('un-'+id).value,password:document.getElementById('pw-'+id).value,manual:document.getElementById('ma-'+id).checked};document.getElementById('pw-'+id).value='';let x=await api(`/api/sites/${id}/authenticate`,{method:'POST',body:JSON.stringify(body)});poll(id,x.job_id)}
async function poll(id,jid){let j=await api('/api/jobs/'+jid);document.getElementById('j-'+id).innerHTML=`<progress value="${j.progress}" max=100></progress><div class="${j.status==='failed'?'warn':'muted'}">${esc(j.status)} — ${esc(j.message)}</div>`;if(!['completed','failed','needs_manual'].includes(j.status))setTimeout(()=>poll(id,jid),1000);else openCase(current)}
async function details(id){let d=await api('/api/sites/'+id),el=document.getElementById('d-'+id);el.innerHTML=`<div class=row><div><h4>Pages (${d.pages.length})</h4>${d.pages.slice(0,30).map(p=>`<p><span class=pill>${esc(p.auth_scope)}</span> ${esc(p.kind)} <a href="${esc(p.url)}" target=_blank>open</a></p>`).join('')}</div><div><h4>Deposit options (${d.deposits.length})</h4>${d.deposits.map(x=>`<p>${esc(x.token||'')} ${esc(x.network||'')}<br><code>${esc(x.canonical_address)}</code></p>`).join('')}</div></div><h4>Evidence (${d.evidence.length})</h4>${d.evidence.slice(0,50).map(e=>`<details><summary><span class=pill>${esc(e.source_class)}</span> ${esc(e.kind)} · ${(e.confidence*100).toFixed(0)}%</summary><pre>${esc(JSON.stringify(JSON.parse(e.value_json),null,2))}</pre></details>`).join('')}`}
async function addNote(){if(!note.value.trim())return;await api(`/api/cases/${current}/notes`,{method:'POST',body:JSON.stringify({body:note.value})});note.value='';openCase(current)}
async function doSearch(){let d=await api('/api/search?q='+encodeURIComponent(search.value));caseView.classList.add('hidden');welcome.classList.add('hidden');searchView.classList.remove('hidden');searchView.innerHTML=`<div class=card><h2>Search results</h2>${d.sites.map(x=>`<p><b>${esc(x.normalized_domain)}</b> ${esc(x.title||'')}</p>`).join('')}${d.evidence.map(x=>`<details><summary>${esc(x.kind)} · ${esc(x.website_id)}</summary><pre>${esc(x.value_json)}</pre></details>`).join('')}${d.notes.map(x=>`<p><span class=pill>note</span>${esc(x.body)}</p>`).join('')}</div>`}
loadCases();
</script></body></html>
